name: Bug report
description: Something in Chordra is broken.
labels: [bug]
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where?
      multiple: true
      options:
        - Chordra Cloud
        - My own computer
        - Phone
        - Desktop browser
    validations:
      required: true
  - type: input
    id: session
    attributes:
      label: Session link (optional)
      description: Only people on your team can open it; it helps us find the right logs.
